name: Build & publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels:
    name: Build cp${{ matrix.python }} wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v6

      - name: Clone Codeup private repo
        run: |
          git clone https://oauth2:${{ secrets.CODEUP_TOKEN }}@codeup.aliyun.com/zheniz0322/Python/packages/lyzcrypto.git demo
          ls ./

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Linux 编译依赖
      - name: Install Linux system compile toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-dev

      # Windows VC编译工具
      - name: Install Windows VC++ build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Python依赖
      - name: Install build dependencies
        run: pip install Pillow Cython setuptools wheel mypy py2pydso -i https://pypi.org/simple -U

      # 执行自研构建脚本 --keep-tmp 异常时保留临时目录
      - name: Build protected wheel (keep tmp for debug)
        working-directory: demo
        run: python -m py2pydso package -m lyzcrypto -o ../wheelhouse --pyi

      # 跨平台打印wheel列表
      - name: Print all built wheels in wheelhouse
        run: |
          python -c "
          import os
          print('=== wheelhouse directory contents ===')
          for filename in sorted(os.listdir('wheelhouse')):
              full_path = os.path.join('wheelhouse', filename)
              size = os.path.getsize(full_path)
              print(f'{filename:<50} {size} bytes')
          "

      # 失败上传调试包
      - name: Upload debug artifact on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: debug-wheel-fail-cp${{ matrix.python }}-${{ matrix.os }}
          path: wheelhouse/

      # 上传产物
      - name: Upload built wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-cp${{ matrix.python }}-${{ matrix.os }}
          path: wheelhouse/*.whl
  
  publish:
    needs: build-wheels
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          path: artifacts

      - name: Collect wheels
        run: |
          mkdir -p dist
          find artifacts -name "*.whl" -exec cp {} dist/ \;
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist